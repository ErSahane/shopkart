{% extends 'base.html' %}
{% block title %}Register - ShopKart{% endblock %}
{% block content %}
<div class="auth-wrap">
  <form class="auth-card" method="post">{% csrf_token %}
    <h1>Create account</h1>
    {{ form.as_p }}
    <button class="btn btn-dark w-100">Register</button>
    <p class="mt-3">Already have an account? <a href="{% url 'login' %}">Login</a></p>
  </form>
</div>
{% endblock %}
