{% extends 'base.html' %}
{% block title %}Login - ShopKart{% endblock %}
{% block content %}
<div class="auth-wrap">
  <form class="auth-card" method="post">{% csrf_token %}
    <h1>Welcome back</h1>
    {{ form.as_p }}
    <button class="btn btn-dark w-100">Login</button>
    <p class="mt-3"><a href="{% url 'password_reset' %}">Forgot password?</a> · <a href="{% url 'register' %}">Create account</a></p>
  </form>
</div>
{% endblock %}
